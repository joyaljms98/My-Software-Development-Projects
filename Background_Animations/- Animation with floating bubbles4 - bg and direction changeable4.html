<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Geometric Background</title>
    <style>
        /* Basic CSS reset and body styling */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            /* This radial gradient is the initial background */
            background: radial-gradient(ellipse at center, #302b63 0%, #24243e 70%, #0f0c29 100%);
            font-family: 'Inter', sans-serif;
            transition: background 0.5s ease; /* Smooth transition for background changes */
        }

        /* Canvas styling to ensure it fills the background */
        #background-canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1; /* Keep canvas in the background */
        }

        /* Centered content container */
        .content {
            position: relative;
            z-index: 2; /* Place content above the canvas */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
            color: white;
            text-align: center;
        }

        .message-box {
            background: rgba(0, 0, 0, 0.2);
            padding: 40px;
            border-radius: 15px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        h1 {
            font-size: 2.5rem;
            margin: 0;
        }

        p {
            font-size: 1.2rem;
            margin-top: 10px;
        }
        
        /* Main container for all controls */
        .controls-container {
            position: absolute;
            bottom: 25px;
            right: 25px;
            z-index: 3;
        }
        
        /* The settings panel, hidden by default */
        #settings-panel {
            display: none; /* Initially hidden */
            flex-direction: column;
            align-items: center;
            gap: 20px;
            background-color: rgba(0, 0, 0, 0.5);
            padding: 20px;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(5px);
            position: absolute;
            bottom: 75px; /* Position above the settings button */
            right: 0;
            transition: opacity 0.3s, transform 0.3s;
            transform: translateY(10px);
            opacity: 0;
        }

        #settings-panel.visible {
            display: flex;
            transform: translateY(0);
            opacity: 1;
        }

        /* Styling for the control buttons */
        .control-btn {
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: 500;
            color: white;
            background-color: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            cursor: pointer;
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }

        .control-btn:hover {
            background-color: rgba(0, 0, 0, 0.6);
        }

        /* Styling for the speed slider */
        .slider-control {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
        }

        .slider-control label {
            font-size: 0.9rem;
            color: white;
            font-weight: 500;
        }

        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 5px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 5px;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            background: white;
            cursor: pointer;
            border-radius: 50%;
        }

        input[type="range"]::-moz-range-thumb {
            width: 18px;
            height: 18px;
            background: white;
            cursor: pointer;
            border-radius: 50%;
            border: none;
        }
        
        /* D-pad container */
        .d-pad {
            display: grid;
            grid-template-columns: repeat(3, 40px);
            grid-template-rows: repeat(3, 40px);
            gap: 5px;
        }
        
        .d-pad-btn {
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.5rem;
            line-height: 1;
            padding: 0;
            width: 40px;
            height: 40px;
        }

        #dir-up { grid-column: 2; grid-row: 1; }
        #dir-left { grid-column: 1; grid-row: 2; }
        #dir-random { grid-column: 2; grid-row: 2; }
        #dir-right { grid-column: 3; grid-row: 2; }
        #dir-down { grid-column: 2; grid-row: 3; }
        
        #settings-btn {
            width: 55px;
            height: 55px;
            font-size: 1.8rem;
            border-radius: 50%;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- The canvas element where the animation will be drawn -->
    <canvas id="background-canvas"></canvas>

    <!-- You can place your main content here -->
    <div class="content">
        <div class="message-box">
            <h1>Welcome</h1>
            <p>This is an animated background.</p>
        </div>
    </div>

    <!-- Buttons and slider -->
    <div class="controls-container">
        <div id="settings-panel">
            <div class="slider-control">
                <label for="speed-slider">Speed</label>
                <input type="range" id="speed-slider" min="0.2" max="3" step="0.1" value="1">
            </div>
            <div class="d-pad">
                <button id="dir-up" class="control-btn d-pad-btn">↑</button>
                <button id="dir-left" class="control-btn d-pad-btn">←</button>
                <button id="dir-random" class="control-btn d-pad-btn">●</button>
                <button id="dir-right" class="control-btn d-pad-btn">→</button>
                <button id="dir-down" class="control-btn d-pad-btn">↓</button>
            </div>
            <button id="change-bg-btn" class="control-btn">Change Background</button>
        </div>
        <button id="settings-btn" class="control-btn">⚙️</button>
    </div>

    <script>
        // --- Canvas and Context Setup ---
        const canvas = document.getElementById('background-canvas');
        const ctx = canvas.getContext('2d');

        // Set canvas dimensions to fill the window
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        // --- Controls ---
        const settingsBtn = document.getElementById('settings-btn');
        const settingsPanel = document.getElementById('settings-panel');
        const changeBgBtn = document.getElementById('change-bg-btn');
        const speedSlider = document.getElementById('speed-slider');
        const body = document.body;
        const messageBoxH1 = document.querySelector('.message-box h1');
        const messageBoxP = document.querySelector('.message-box p');
        const allControlElements = document.querySelectorAll('.control-btn, .slider-control');
        const sliderLabel = document.querySelector('.slider-control label');
        
        // Settings Panel Toggle
        settingsBtn.addEventListener('click', (event) => {
            event.stopPropagation(); // Prevent this click from being caught by the window listener
            settingsPanel.classList.toggle('visible');
        });

        // Close panel if clicking outside
        window.addEventListener('click', (event) => {
            if (settingsPanel.classList.contains('visible') && !settingsPanel.contains(event.target) && !settingsBtn.contains(event.target)) {
                settingsPanel.classList.remove('visible');
            }
        });

        // Speed Control
        let speedMultiplier = 1;
        speedSlider.addEventListener('input', (e) => {
            speedMultiplier = parseFloat(e.target.value);
        });

        // Background Changer
        const backgrounds = [
            'radial-gradient(ellipse at center, #302b63 0%, #24243e 70%, #0f0c29 100%)', // Original Purple
            '#000000', // Black
            '#FFFFFF'  // White
        ];
        let currentBgIndex = 0;

        changeBgBtn.addEventListener('click', () => {
            currentBgIndex = (currentBgIndex + 1) % backgrounds.length;
            const newBg = backgrounds[currentBgIndex];
            body.style.background = newBg;

            if (newBg === '#FFFFFF') {
                messageBoxH1.style.color = '#000';
                messageBoxP.style.color = '#333';
                allControlElements.forEach(el => {
                    el.style.color = '#000';
                    el.style.borderColor = 'rgba(0, 0, 0, 0.2)';
                    el.style.backgroundColor = 'rgba(255, 255, 255, 0.5)';
                });
                settingsPanel.style.backgroundColor = 'rgba(255, 255, 255, 0.7)';
                sliderLabel.style.color = '#000';

            } else {
                messageBoxH1.style.color = 'white';
                messageBoxP.style.color = 'white';
                 allControlElements.forEach(el => {
                    el.style.color = 'white';
                    el.style.borderColor = 'rgba(255, 255, 255, 0.2)';
                    el.style.backgroundColor = 'rgba(0, 0, 0, 0.4)';
                });
                settingsPanel.style.backgroundColor = 'rgba(0, 0, 0, 0.5)';
                sliderLabel.style.color = 'white';
            }
        });

        // Direction Changer
        const directions = ['up', 'down', 'left', 'right', 'random'];
        let currentDirIndex = 0;

        document.getElementById('dir-up').addEventListener('click', () => setAllDirections('up'));
        document.getElementById('dir-down').addEventListener('click', () => setAllDirections('down'));
        document.getElementById('dir-left').addEventListener('click', () => setAllDirections('left'));
        document.getElementById('dir-right').addEventListener('click', () => setAllDirections('right'));
        document.getElementById('dir-random').addEventListener('click', () => setAllDirections('random'));

        function setAllDirections(direction) {
            currentDirIndex = directions.indexOf(direction);
            particles.forEach(p => p.setDirection(direction));
        }


        // --- Animation Parameters ---
        const NUM_PARTICLES = 25;
        const WOBBLE_AMOUNT = 0.02; // How much the bubbles drift

        let particles = [];

        // --- Particle Class ---
        class Particle {
            constructor() {
                this.size = Math.random() * 60 + 30;
                this.setInitialPosition(directions[currentDirIndex]);
                this.setDirection(directions[currentDirIndex]);
            }

            setInitialPosition(direction) {
                 switch (direction) {
                    case 'up':
                        this.x = Math.random() * canvas.width;
                        this.y = canvas.height + this.size + Math.random() * canvas.height;
                        break;
                    case 'down':
                        this.x = Math.random() * canvas.width;
                        this.y = -this.size - Math.random() * canvas.height;
                        break;
                    case 'left':
                        this.x = canvas.width + this.size + Math.random() * canvas.width;
                        this.y = Math.random() * canvas.height;
                        break;
                    case 'right':
                        this.x = -this.size - Math.random() * canvas.width;
                        this.y = Math.random() * canvas.height;
                        break;
                    default: // random
                        this.x = Math.random() * canvas.width;
                        this.y = Math.random() * canvas.height;
                        break;
                }
            }
            
            setDirection(direction) {
                switch (direction) {
                    case 'up':
                        this.vx = (Math.random() - 0.5) * 0.3;
                        this.vy = -(Math.random() * 0.8 + 0.2);
                        break;
                    case 'down':
                        this.vx = (Math.random() - 0.5) * 0.3;
                        this.vy = Math.random() * 0.8 + 0.2;
                        break;
                    case 'left':
                        this.vx = -(Math.random() * 0.8 + 0.2);
                        this.vy = (Math.random() - 0.5) * 0.3;
                        break;
                    case 'right':
                        this.vx = Math.random() * 0.8 + 0.2;
                        this.vy = (Math.random() - 0.5) * 0.3;
                        break;
                    case 'random':
                        this.vx = (Math.random() - 0.5) * 0.8;
                        this.vy = (Math.random() - 0.5) * 0.8;
                        break;
                }
            }

            update() {
                this.vx += (Math.random() - 0.5) * WOBBLE_AMOUNT;
                this.vy += (Math.random() - 0.5) * WOBBLE_AMOUNT;

                this.x += this.vx * speedMultiplier;
                this.y += this.vy * speedMultiplier;

                if (this.vy < 0 && this.y + this.size < 0) {
                    this.y = canvas.height + this.size;
                    this.x = Math.random() * canvas.width;
                } else if (this.vy > 0 && this.y - this.size > canvas.height) {
                    this.y = -this.size;
                    this.x = Math.random() * canvas.width;
                } else if (this.vx < 0 && this.x + this.size < 0) {
                    this.x = canvas.width + this.size;
                    this.y = Math.random() * canvas.height;
                } else if (this.vx > 0 && this.x - this.size > canvas.width) {
                    this.x = -this.size;
                    this.y = Math.random() * canvas.height;
                }
            }

            draw(bgIndex) {
                ctx.save();
                ctx.translate(this.x, this.y);

                const radius = this.size / 2;
                
                let colors;
                if (bgIndex === 2) { // White background
                    colors = {
                        bodyEdge: 'rgba(0, 0, 0, 0.05)', highlight: 'rgba(0, 0, 0, 0.1)',
                        specular: 'rgba(255, 255, 255, 0.7)', arc1: 'rgba(180, 40, 200, 0.25)',
                        arc2: 'rgba(40, 180, 200, 0.25)'
                    };
                } else if (bgIndex === 1) { // Black background
                    colors = {
                        bodyEdge: 'rgba(255, 255, 255, 0.08)', highlight: 'rgba(255, 255, 255, 0.2)',
                        specular: 'rgba(255, 255, 255, 0.75)', arc1: 'rgba(255, 192, 203, 0.25)',
                        arc2: 'rgba(173, 216, 230, 0.3)'
                    };
                } else { // Default dark background (purple)
                    colors = {
                        bodyEdge: 'rgba(255, 255, 255, 0.05)', highlight: 'rgba(255, 255, 255, 0.15)',
                        specular: 'rgba(255, 255, 255, 0.6)', arc1: 'rgba(255, 192, 203, 0.2)',
                        arc2: 'rgba(173, 216, 230, 0.2)'
                    };
                }

                const bodyGradient = ctx.createRadialGradient(0, 0, 0, 0, 0, radius);
                bodyGradient.addColorStop(0, 'rgba(0, 0, 0, 0)');
                bodyGradient.addColorStop(0.7, 'rgba(0, 0, 0, 0)');
                bodyGradient.addColorStop(1, colors.bodyEdge);
                ctx.beginPath(); ctx.arc(0, 0, radius, 0, Math.PI * 2); ctx.fillStyle = bodyGradient; ctx.fill();

                const highlightGradient = ctx.createRadialGradient(-radius * 0.4, -radius * 0.4, 0, 0, 0, radius);
                highlightGradient.addColorStop(0, colors.highlight);
                highlightGradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
                ctx.beginPath(); ctx.arc(0, 0, radius, 0, Math.PI * 2); ctx.fillStyle = highlightGradient; ctx.fill();

                ctx.beginPath(); ctx.arc(-radius * 0.4, -radius * 0.4, radius * 0.1, 0, Math.PI * 2); ctx.fillStyle = colors.specular; ctx.fill();
                
                ctx.beginPath(); ctx.arc(0, 0, radius * 0.9, Math.PI * 0.2, Math.PI * 0.4); ctx.strokeStyle = colors.arc1; ctx.lineWidth = radius * 0.04; ctx.stroke();
                ctx.beginPath(); ctx.arc(0, 0, radius * 0.85, Math.PI * 1.5, Math.PI * 1.7); ctx.strokeStyle = colors.arc2; ctx.lineWidth = radius * 0.05; ctx.stroke();

                ctx.restore();
            }
        }

        // --- Helper Functions ---
        function init() {
            particles = [];
            for (let i = 0; i < NUM_PARTICLES; i++) {
                particles.push(new Particle());
            }
        }

        // --- Animation Loop ---
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update();
                p.draw(currentBgIndex);
            });
            requestAnimationFrame(animate);
        }

        // --- Event Listeners ---
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            init();
        });

        // --- Start the Animation ---
        init();
        animate();
    </script>
</body>
</html>
